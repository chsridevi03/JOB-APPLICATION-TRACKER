<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Companies - JobTrack</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="d-flex">
  <!-- Sidebar -->
  <aside class="sidebar p-3 d-flex flex-col flex-shrink-0">
    <a href="dashboard.html" class="d-flex align-items-center mb-4 text-decoration-none text-primary fs-5 fw-bold px-2">
      <i class="bi bi-briefcase-fill me-2"></i> JobTrack
    </a>
    <ul class="nav flex-column mb-auto">
      <li class="nav-item"><a href="dashboard.html" class="nav-link"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
      <li class="nav-item"><a href="applications.html" class="nav-link"><i class="bi bi-file-earmark-text"></i> Applications</a></li>
      <li class="nav-item"><a href="on_hold.html" class="nav-link"><i class="bi bi-pause-circle text-warning"></i> On Hold</a></li>
      <li class="nav-item"><a href="companies.html" class="nav-link active"><i class="bi bi-building"></i> Companies</a></li>
      <li class="nav-item"><a href="profile.html" class="nav-link"><i class="bi bi-person-gear"></i> Profile & Alerts</a></li>
    </ul>
  </aside>

  <!-- Main Content -->
  <main class="flex-grow-1 p-4 overflow-auto" style="height: 100vh;">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h3 class="fw-bold text-dark mb-0">Companies Directory</h3>
        <p class="text-muted small mb-0">Maintain company profiles, recruiter emails, and job openings</p>
      </div>
      <button class="btn btn-primary btn-sm px-3 fw-semibold" data-bs-toggle="modal" data-bs-target="#addCompanyModal">
        <i class="bi bi-plus-lg me-1"></i> Add Company
      </button>
    </div>

    <!-- Search Box -->
    <div class="stat-card p-3 mb-4">
      <div class="input-group input-group-sm">
        <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
        <input type="text" id="companySearch" class="form-control" placeholder="Search companies by name...">
      </div>
    </div>

    <!-- Grid -->
    <div id="companiesGrid" class="row g-4">
      <div class="col-12 text-center text-muted py-5">Loading companies...</div>
    </div>
  </main>
</div>

<!-- Modal: Add Company -->
<div class="modal fade" id="addCompanyModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fs-6 fw-bold">Add New Company</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="addCompanyForm">
        <div class="modal-body small">
          <div class="mb-3">
            <label class="form-label fw-semibold">Company Name *</label>
            <input type="text" id="compName" class="form-control form-control-sm" required placeholder="e.g. Stripe">
          </div>
          <div class="row g-2 mb-3">
            <div class="col-6">
              <label class="form-label fw-semibold">Website</label>
              <input type="text" id="compWebsite" class="form-control form-control-sm" placeholder="https://stripe.com">
            </div>
            <div class="col-6">
              <label class="form-label fw-semibold">Location</label>
              <input type="text" id="compLocation" class="form-control form-control-sm" placeholder="San Francisco, CA">
            </div>
          </div>
          <div class="row g-2 mb-3">
            <div class="col-6">
              <label class="form-label fw-semibold">HR Contact Email</label>
              <input type="email" id="compEmail" class="form-control form-control-sm" placeholder="careers@stripe.com">
            </div>
            <div class="col-6">
              <label class="form-label fw-semibold">Phone Number</label>
              <input type="text" id="compPhone" class="form-control form-control-sm" placeholder="+1 (415) 555-0199">
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Description</label>
            <textarea id="compDesc" class="form-control form-control-sm" rows="3" placeholder="Brief company overview..."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary btn-sm">Create Company</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script>
  let companiesList = [];

  async function loadCompanies() {
    try {
      const data = await apiRequest('/companies');
      companiesList = data;
      renderCompanies();
    } catch (err) {
      console.error(err);
    }
  }

  function renderCompanies() {
    const search = document.getElementById('companySearch').value.toLowerCase();
    const container = document.getElementById('companiesGrid');
    container.innerHTML = '';

    const filtered = companiesList.filter(c => c.company_name.toLowerCase().includes(search));

    if (filtered.length === 0) {
      container.innerHTML = '<div class="col-12 text-center text-muted py-5">No companies found.</div>';
      return;
    }

    filtered.forEach(c => {
      const col = document.createElement('div');
      col.className = 'col-md-4';
      col.innerHTML = `
        <div class="card stat-card p-4 h-100 d-flex flex-column justify-content-between">
          <div>
            <div class="d-flex justify-content-between align-items-start mb-2">
              <div class="p-2 bg-light rounded text-primary fs-5"><i class="bi bi-building"></i></div>
              <button class="btn btn-sm btn-outline-danger py-0 px-2 delete-comp" data-id="${c.id}"><i class="bi bi-trash"></i></button>
            </div>
            <h5 class="fw-bold text-dark mb-1">${c.company_name}</h5>
            <p class="small text-muted mb-3 line-clamp-2">${c.description || 'No description added.'}</p>
            
            <div class="small text-muted space-y-1">
              ${c.location ? `<div><i class="bi bi-geo-alt me-1"></i> ${c.location}</div>` : ''}
              ${c.website ? `<div><i class="bi bi-globe me-1"></i> <a href="${c.website}" target="_blank" class="text-decoration-none">${c.website}</a></div>` : ''}
              ${c.contact_email ? `<div><i class="bi bi-envelope me-1"></i> ${c.contact_email}</div>` : ''}
            </div>
          </div>
          <div class="border-top pt-2 mt-3 small d-flex justify-content-between text-muted">
            <span>${c.applicationsCount || 0} applications</span>
            <a href="applications.html" class="text-primary text-decoration-none fw-semibold">View Jobs</a>
          </div>
        </div>
      `;
      container.appendChild(col);
    });

    document.querySelectorAll('.delete-comp').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        const id = e.currentTarget.getAttribute('data-id');
        if (confirm('Delete this company?')) {
          await apiRequest(`/companies/${id}`, { method: 'DELETE' });
          loadCompanies();
        }
      });
    });
  }

  document.getElementById('addCompanyForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const payload = {
      company_name: document.getElementById('compName').value,
      website: document.getElementById('compWebsite').value,
      location: document.getElementById('compLocation').value,
      contact_email: document.getElementById('compEmail').value,
      phone: document.getElementById('compPhone').value,
      description: document.getElementById('compDesc').value
    };

    try {
      await apiRequest('/companies', {
        method: 'POST',
        body: JSON.stringify(payload)
      });
      bootstrap.Modal.getInstance(document.getElementById('addCompanyModal')).hide();
      loadCompanies();
    } catch (err) {
      alert(err.message);
    }
  });

  document.getElementById('companySearch').addEventListener('input', renderCompanies);
  onRealtimeEvent(() => loadCompanies());
  loadCompanies();
</script>
</body>
</html>
