<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>On Hold Applications - JobTrack</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="d-flex">
  <!-- Sidebar -->
  <aside class="sidebar p-3 d-flex flex-col flex-shrink-0">
    <a href="dashboard.html" class="d-flex align-items-center mb-4 text-decoration-none text-primary fs-5 fw-bold px-2">
      <i class="bi bi-briefcase-fill me-2"></i> JobTrack
    </a>
    <ul class="nav flex-column mb-auto">
      <li class="nav-item"><a href="dashboard.html" class="nav-link"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
      <li class="nav-item"><a href="applications.html" class="nav-link"><i class="bi bi-file-earmark-text"></i> Applications</a></li>
      <li class="nav-item"><a href="on_hold.html" class="nav-link active"><i class="bi bi-pause-circle text-warning"></i> On Hold</a></li>
      <li class="nav-item"><a href="companies.html" class="nav-link"><i class="bi bi-building"></i> Companies</a></li>
      <li class="nav-item"><a href="profile.html" class="nav-link"><i class="bi bi-person-gear"></i> Profile & Alerts</a></li>
    </ul>
  </aside>

  <!-- Main Content -->
  <main class="flex-grow-1 p-4 overflow-auto" style="height: 100vh;">
    <div class="alert alert-warning border border-warning-subtle d-flex align-items-center gap-3 mb-4 p-4">
      <i class="bi bi-exclamation-triangle-fill fs-3 text-warning"></i>
      <div>
        <h5 class="fw-bold mb-1">On Hold Applications</h5>
        <p class="small mb-0 text-muted">Separate dashboard monitoring all applications paused or delayed by employers.</p>
      </div>
    </div>

    <div id="onHoldContainer" class="row g-4">
      <div class="col-12 text-center text-muted py-5">Loading On Hold applications...</div>
    </div>
  </main>
</div>

<!-- Modal: Edit Reason -->
<div class="modal fade" id="editReasonModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fs-6 fw-bold">Update On Hold Reason</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="editReasonForm">
        <div class="modal-body small">
          <label class="form-label fw-semibold">Reason *</label>
          <textarea id="editReasonInput" class="form-control form-control-sm" rows="3" required></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary btn-sm">Save Changes</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script>
  let editTargetId = null;

  async function loadOnHold() {
    try {
      const data = await apiRequest('/applications/on-hold');
      const container = document.getElementById('onHoldContainer');
      container.innerHTML = '';

      if (!data || data.length === 0) {
        container.innerHTML = '<div class="col-12 text-center text-muted py-5">No applications are currently On Hold.</div>';
        return;
      }

      data.forEach(app => {
        const col = document.createElement('div');
        col.className = 'col-md-6';
        col.innerHTML = `
          <div class="card stat-card border-warning-subtle p-4 h-100">
            <div class="d-flex justify-content-between align-items-start mb-2">
              <span class="badge badge-on-hold">On Hold</span>
              <span class="text-muted small">${app.application_date}</span>
            </div>
            <h5 class="fw-bold text-dark mb-1">${app.job_position}</h5>
            <div class="small text-muted mb-3"><i class="bi bi-building"></i> ${app.company_name}</div>
            
            <div class="p-3 bg-light rounded border mb-3 small">
              <div class="d-flex justify-content-between mb-1">
                <span class="fw-bold text-warning-emphasis">Reason:</span>
                <a href="#" class="edit-reason text-primary text-decoration-none fw-semibold" data-id="${app.id}" data-reason="${app.on_hold_reason || ''}">Edit Reason</a>
              </div>
              <div>${app.on_hold_reason || 'No specific reason given.'}</div>
            </div>

            <div class="d-flex justify-content-between align-items-center mt-auto pt-2 border-top">
              <span class="small text-muted">Resume pipeline:</span>
              <select class="form-select form-select-sm resume-dropdown" data-id="${app.id}" style="width: 150px;">
                <option value="On Hold">Keep On Hold</option>
                <option value="Applied">Move to Applied</option>
                <option value="Interview">Move to Interview</option>
                <option value="Selected">Move to Selected</option>
                <option value="Rejected">Move to Rejected</option>
              </select>
            </div>
          </div>
        `;
        container.appendChild(col);
      });

      document.querySelectorAll('.edit-reason').forEach(link => {
        link.addEventListener('click', (e) => {
          e.preventDefault();
          editTargetId = e.currentTarget.getAttribute('data-id');
          document.getElementById('editReasonInput').value = e.currentTarget.getAttribute('data-reason');
          const m = new bootstrap.Modal(document.getElementById('editReasonModal'));
          m.show();
        });
      });

      document.querySelectorAll('.resume-dropdown').forEach(sel => {
        sel.addEventListener('change', async (e) => {
          const id = e.target.getAttribute('data-id');
          const newStatus = e.target.value;
          if (newStatus !== 'On Hold') {
            await apiRequest(`/applications/${id}/status`, {
              method: 'PATCH',
              body: JSON.stringify({ status: newStatus })
            });
            loadOnHold();
          }
        });
      });

    } catch (err) {
      console.error(err);
    }
  }

  document.getElementById('editReasonForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const reason = document.getElementById('editReasonInput').value;
    if (editTargetId && reason) {
      await apiRequest(`/applications/${editTargetId}/status`, {
        method: 'PATCH',
        body: JSON.stringify({ status: 'On Hold', reason })
      });
      bootstrap.Modal.getInstance(document.getElementById('editReasonModal')).hide();
      loadOnHold();
    }
  });

  onRealtimeEvent(() => loadOnHold());
  loadOnHold();
</script>
</body>
</html>
