<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - JobTrack</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-5">

  <div class="card stat-card shadow-sm border p-4" style="max-width: 440px; width: 100%;">
    <div class="text-center mb-4">
      <div class="text-primary fs-2 mb-2"><i class="bi bi-briefcase-fill"></i></div>
      <h4 class="fw-bold text-dark">Create Your Account</h4>
      <p class="text-muted small">Start tracking job applications and interview schedules</p>
    </div>

    <div id="errorAlert" class="alert alert-danger py-2 small d-none"></div>

    <form id="registerForm">
      <div class="mb-3">
        <label class="form-label small fw-semibold">Full Name</label>
        <input type="text" id="name" class="form-control form-control-sm" required placeholder="Sarah Connor">
      </div>
      <div class="mb-3">
        <label class="form-label small fw-semibold">Email Address</label>
        <input type="email" id="email" class="form-control form-control-sm" required placeholder="name@example.com">
      </div>
      <div class="mb-3">
        <label class="form-label small fw-semibold">Password</label>
        <input type="password" id="password" class="form-control form-control-sm" required placeholder="••••••••" minlength="6">
      </div>
      <div class="mb-3">
        <label class="form-label small fw-semibold">Confirm Password</label>
        <input type="password" id="confirmPassword" class="form-control form-control-sm" required placeholder="••••••••" minlength="6">
      </div>
      <button type="submit" class="btn btn-primary w-100 btn-sm py-2 fw-semibold mb-3">Register Account</button>
    </form>

    <div class="text-center small text-muted">
      Already have an account? <a href="login.html" class="text-primary text-decoration-none fw-semibold">Log in</a>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errBox = document.getElementById('errorAlert');
      errBox.classList.add('d-none');
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        errBox.textContent = 'Passwords do not match.';
        errBox.classList.remove('d-none');
        return;
      }

      try {
        const res = await apiRequest('/register', {
          method: 'POST',
          body: JSON.stringify({ name, email, password })
        });
        Auth.setToken(res.token);
        window.location.href = 'dashboard.html';
      } catch (err) {
        errBox.textContent = err.message;
        errBox.classList.remove('d-none');
      }
    });
  </script>
</body>
</html>
